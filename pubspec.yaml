name: butter
description: "BUTTER — free-forever offline music player"
publish_to: 'none'

version: 0.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gate 1 audio engine
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/test/
    - assets/art/fallback-cover.png
